<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="390" viewBox="0 0 1400 390" role="img" aria-labelledby="title desc">
  <title id="title">Model Release Observatory</title>
  <desc id="desc">A dark navy MLOps illustration showing experiment metrics, a model artifact, release evidence, and drift monitoring.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071424"/>
      <stop offset=".52" stop-color="#102944"/>
      <stop offset="1" stop-color="#091827"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A5B4FC"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D3553"/>
      <stop offset="1" stop-color="#10223A"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#0EA5E9" stop-opacity=".3"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#93C5FD" stroke-opacity=".08"/>
    </pattern>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1400" height="390" rx="24" fill="url(#bg)"/>
  <rect width="1400" height="390" rx="24" fill="url(#grid)"/>
  <ellipse cx="1090" cy="190" rx="400" ry="285" fill="url(#glow)"/>
  <path d="M0 325C240 275 400 367 660 320S1100 286 1400 320V390H0Z" fill="#020B18" fill-opacity=".48"/>
  <path d="M0 325C240 275 400 367 660 320S1100 286 1400 320" fill="none" stroke="#4E779A" stroke-opacity=".26"/>

  <g transform="translate(74 63)">
    <rect width="44" height="44" rx="12" fill="#173452" stroke="#38BDF8" stroke-opacity=".65"/>
    <path d="M12 31V13h6l5 6 5-6h5v18M12 22h6M28 22h5" fill="none" stroke="url(#cyan)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="17" fill="#7DD3FC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="750" letter-spacing="3">ML LIFECYCLE · EVIDENCE FIRST</text>
    <text x="0" y="98" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="47" font-weight="800" letter-spacing="-1.5">Model Release</text>
    <text x="0" y="151" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="47" font-weight="800" letter-spacing="-1.5">Observatory</text>
    <text x="0" y="188" fill="#C4D7EB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="650">Reproduce. Evaluate. Decide with evidence.</text>
    <text x="0" y="218" fill="#8EA8C3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Experiment tracking · Release policy · Drift signals · Inference latency</text>
    <g transform="translate(0 244)">
      <rect width="122" height="31" rx="15.5" fill="#3A2C1B" stroke="#FBBF24" stroke-opacity=".55"/>
      <circle cx="15" cy="15.5" r="4" fill="#FBBF24"/>
      <text x="27" y="20" fill="#FEF3C7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="700">LOCAL MVP</text>
      <rect x="133" width="158" height="31" rx="15.5" fill="#11313A" stroke="#22D3EE" stroke-opacity=".5"/>
      <path d="M148 11h11v10h-11zM151 8h5" fill="none" stroke="#67E8F9" stroke-width="1.5" stroke-linejoin="round"/>
      <text x="167" y="20" fill="#CFFAFE" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="700">PYTHON + MLFLOW</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="812" y="42" width="267" height="294" rx="18" fill="url(#panel)" stroke="#52789A" stroke-opacity=".75"/>
    <text x="834" y="69" fill="#D9E9F7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="750" letter-spacing="1">EXPERIMENT RUN</text>
    <text x="834" y="91" fill="#8EA8C3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.5">RandomForest · local tracking</text>
    <g transform="translate(834 110)">
      <rect width="105" height="58" rx="10" fill="#0D2238" stroke="#356080" stroke-opacity=".7"/>
      <text x="12" y="18" fill="#8EA8C3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9.5" font-weight="650">F1 SCORE</text>
      <text x="12" y="43" fill="#67E8F9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800">0.966</text>
      <rect x="116" width="105" height="58" rx="10" fill="#0D2238" stroke="#356080" stroke-opacity=".7"/>
      <text x="128" y="18" fill="#8EA8C3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9.5" font-weight="650">RECALL</text>
      <text x="128" y="43" fill="#A5B4FC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800">0.972</text>
    </g>
    <text x="834" y="194" fill="#D9E9F7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="700">Evaluation evidence</text>
    <g transform="translate(834 208)">
      <path d="M0 53H220" stroke="#52708D" stroke-opacity=".6"/>
      <path d="M0 36H220M0 19H220M0 2H220" stroke="#52708D" stroke-opacity=".24" stroke-dasharray="3 5"/>
      <rect x="12" y="22" width="22" height="31" rx="4" fill="#38BDF8"/>
      <rect x="49" y="12" width="22" height="41" rx="4" fill="#60A5FA"/>
      <rect x="86" y="18" width="22" height="35" rx="4" fill="#818CF8"/>
      <rect x="123" y="6" width="22" height="47" rx="4" fill="#A5B4FC"/>
      <rect x="160" y="14" width="22" height="39" rx="4" fill="#67E8F9"/>
      <path d="M23 18 60 8 97 14 134 2 171 10" fill="none" stroke="#F0FDFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="23" cy="18" r="2.8" fill="#F0FDFF"/><circle cx="60" cy="8" r="2.8" fill="#F0FDFF"/><circle cx="97" cy="14" r="2.8" fill="#F0FDFF"/><circle cx="134" cy="2" r="2.8" fill="#F0FDFF"/><circle cx="171" cy="10" r="2.8" fill="#F0FDFF"/>
    </g>
    <text x="834" y="286" fill="#8EA8C3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9.5">Illustrative metrics · local demo</text>
    <rect x="834" y="299" width="221" height="23" rx="7" fill="#1E3A35" stroke="#34D399" stroke-opacity=".4"/>
    <circle cx="846" cy="310.5" r="3" fill="#34D399"/>
    <text x="856" y="314" fill="#A7F3D0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700">POLICY-BASED RELEASE REPORT</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1110" y="63" width="226" height="114" rx="16" fill="#132943" stroke="#51799A" stroke-opacity=".7"/>
    <circle cx="1141" cy="96" r="15" fill="#223F5C"/>
    <path d="M1134 96h14M1141 89v14M1136 91l10 10M1146 91l-10 10" stroke="#67E8F9" stroke-width="1.5" stroke-linecap="round"/>
    <text x="1166" y="92" fill="#C9E4F8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="750" letter-spacing=".9">DRIFT SIGNAL</text>
    <text x="1128" y="127" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="750">KS test</text>
    <text x="1128" y="147" fill="#8EA8C3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.5">Univariate · synthetic shift</text>

    <rect x="1110" y="198" width="226" height="114" rx="16" fill="#132943" stroke="#51799A" stroke-opacity=".7"/>
    <rect x="1128" y="217" width="27" height="31" rx="6" fill="#193D56" stroke="#38BDF8" stroke-opacity=".5"/>
    <path d="M1134 225h15M1134 231h15M1134 237h10" stroke="#7DD3FC" stroke-width="1.6" stroke-linecap="round"/>
    <text x="1166" y="227" fill="#C9E4F8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="750" letter-spacing=".9">INFERENCE</text>
    <text x="1128" y="272" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="750">FastAPI endpoint</text>
    <text x="1128" y="291" fill="#8EA8C3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.5">P50 / P90 / P99 benchmark</text>
  </g>
  <path d="M1079 110H1094M1087 104l7 6-7 6" fill="none" stroke="#67E8F9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1079 260H1094M1087 254l7 6-7 6" fill="none" stroke="#818CF8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1360" y="365" text-anchor="end" fill="#607E9D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" letter-spacing="1.4">TRACEABLE EXPERIMENTS · EXPLICIT LIMITATIONS</text>
</svg>